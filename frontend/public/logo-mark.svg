<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Safety Incident Triangle -->
  <polygon points="256,90 415,365 97,365" fill="none" stroke="url(#warnGrad)" stroke-width="26" stroke-linejoin="round"/>
  <path d="M256,180 L256,270" stroke="#f59e0b" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="315" r="11" fill="#f59e0b"/>

  <!-- Analytics / Trend Tracking Polyline -->
  <polyline points="105,395 185,335 265,375 375,250" fill="none" stroke="url(#trendGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="350,225 415,235 395,300" fill="#0284c7"/>

  <!-- Cafeteria Coffee / Cup Symbol -->
  <ellipse cx="320" cy="425" rx="55" ry="12" fill="#94a3b8"/>
  <rect x="280" y="365" width="80" height="55" rx="14" fill="#f8fafc"/>
  <path d="M360,378 C382,378 382,408 360,408" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
</svg>