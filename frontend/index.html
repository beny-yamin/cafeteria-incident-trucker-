<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafeteria Incident Tracker | UniSafe Dining</title>
    <meta
      name="description"
      content="University Food Quality Assurance, Incident Reporting & Safety Management System"
    />

    <!-- Web App Manifest for PWA and Desktop Installability -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard Favicons and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/logo-128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo-256.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />

    <!-- Apple Touch Icons (iOS & Safari) -->
    <link rel="apple-touch-icon" href="/logo-128.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/logo-128.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/logo-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-512.png" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Incident Tracker" />
    <meta name="application-name" content="Cafeteria Incident Tracker" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/logo-256.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA and Desktop installation
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
